[package]
name = "netscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unprivileged netscope command line"

[[bin]]
name = "netscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
netscope-linux = { version = "0.1.0", path = "../netscope-linux" }
serde_json = "1"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"
zstd = "0.13"
