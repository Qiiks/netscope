name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 zstd libxkbcommon-dev libwayland-dev pkg-config

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="netscope-v${version}-x86_64-linux"
          dir="dist/${name}"
          mkdir -p "$dir"
          install -Dm755 target/release/netscope "$dir/netscope"
          install -Dm755 target/release/netscoped "$dir/netscoped"
          install -Dm755 target/release/netscope-gui "$dir/netscope-gui"
          install -Dm644 packaging/netscope-gui.desktop "$dir/netscope-gui.desktop"
          install -Dm644 packaging/icons/netscope-gui.png "$dir/netscope-gui.png"
          install -Dm644 packaging/netscoped.service "$dir/netscoped.service"
          install -Dm644 packaging/netscope.sysusers "$dir/netscope.sysusers"
          install -Dm644 packaging/config.toml "$dir/config.toml"
          install -Dm755 install.sh "$dir/install.sh"
          install -Dm755 uninstall.sh "$dir/uninstall.sh"
          install -Dm644 LICENSE-MIT "$dir/LICENSE-MIT"
          install -Dm644 LICENSE-APACHE "$dir/LICENSE-APACHE"
          install -Dm644 README.md "$dir/README.md"
          tar --zstd -cf "dist/${name}.tar.zst" -C dist "$name"
          (cd dist && sha256sum "${name}.tar.zst") > dist/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.zst dist/SHA256SUMS --generate-notes

  crates:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # netscope-gui is excluded: it builds against rune from git, which
      # crates.io rejects. It has publish = false and ships as a binary only.
      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          agent="netscope-release/$(basename "$GITHUB_REPOSITORY")"

          published() {
            curl -fsS "https://crates.io/api/v1/crates/$1/$version" \
              -H "User-Agent: $agent" >/dev/null 2>&1
          }

          # Order is forced by path dependencies: linux -> client -> cli/daemon.
          # cargo publish waits for the index entry, so the dependent resolves.
          for crate in netscope-linux netscope-client netscope-cli netscope-daemon; do
            if published "$crate"; then
              echo "$crate $version already on crates.io; skipping"
              continue
            fi
            attempt=1
            until cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"; do
              if [ "$attempt" -ge 4 ]; then
                echo "$crate publish failed after $attempt attempts" >&2
                exit 1
              fi
              echo "$crate publish attempt $attempt failed; retrying" >&2
              attempt=$((attempt + 1))
              sleep 20
            done
          done
